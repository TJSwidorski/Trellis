name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Development happens on Windows 11; several fixes in this history are
        # process-spawn and filesystem behavior that only diverges on win32
        # (child_process shell semantics, path separators, case-insensitive
        # FS). ubuntu-only CI let a Windows-only bug ship green before — see
        # CHANGELOG v2.6.0.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # kit/regression/run.mjs and kit/selftest/e2e.mjs stand up real scratch
      # git repos (gitRepoWith, makeRepo) and commit into them. A CI runner has
      # no git identity configured by default.
      - name: Configure git identity for test fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "Trellis CI"

      - name: Run the full suite (units, regression, e2e)
        run: npm test
